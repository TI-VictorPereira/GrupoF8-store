# Desenvolvimento. O banco é o Postgres deste compose.
# Subir com:  docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: f8
      POSTGRES_PASSWORD: f8
      POSTGRES_DB: f8_store
    ports:
      - "127.0.0.1:8802:5432"
    volumes:
      # No Postgres 18+ o mount é em /var/lib/postgresql (os dados ficam num
      # subdiretório por versão), não mais em /var/lib/postgresql/data.
      - postgres_local:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f8 -d f8_store"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./api
    env_file: ./api/.env
    # `environment` vence o `env_file`, então o DATABASE_URL do arquivo — que
    # aponta para o Neon — fica de lado sem o .env ser tocado. Aqui não há
    # pooler: as duas URLs são a mesma, e o Alembic roda na conexão da
    # aplicação. O overlay do Neon apaga este bloco com `!reset`.
    environment:
      DATABASE_URL: postgresql+psycopg://f8:f8@db:5432/f8_store
      DATABASE_URL_DIRETA: postgresql+psycopg://f8:f8@db:5432/f8_store
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8801:8000"
    volumes:
      # Código montado para o --reload pegar as alterações. O diretório do
      # pacote instalado é preservado para o -e não ser sobrescrito.
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
      - ./api/tests:/app/tests
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8800:5175"
    # Só o que é editado a quente é montado. /app/node_modules fica sendo o da
    # imagem, sem volume por cima — assim mexer em package.json e subir com
    # --build basta para as dependências novas aparecerem.
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
    command: npm run dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_local:
