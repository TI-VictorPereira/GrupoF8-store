# Postgres local, para quando o Neon não estiver acessível (a rede da empresa
# bloqueia a saída na 5432) e para a suíte de testes, que no Neon leva minutos
# só de latência de rede.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# O padrão continua sendo o Neon: `docker compose up` sozinho não usa nada
# daqui. As credenciais abaixo são de um container descartável que só escuta em
# 127.0.0.1 — não são segredo e não servem para mais nada.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: f8
      POSTGRES_PASSWORD: f8
      POSTGRES_DB: f8_store
    ports:
      - "127.0.0.1:8802:5432"
    volumes:
      # No Postgres 18+ o mount é em /var/lib/postgresql (os dados ficam num
      # subdiretório por versão), não mais em /var/lib/postgresql/data.
      - postgres_local:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f8 -d f8_store"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    depends_on:
      db:
        condition: service_healthy
    # `environment` vence o `env_file`, então o DATABASE_URL do .env fica de
    # lado sem o arquivo ser tocado. Aqui não há pooler: as duas URLs são a
    # mesma, e o Alembic roda na mesma conexão da aplicação.
    environment:
      DATABASE_URL: postgresql+psycopg://f8:f8@db:5432/f8_store
      DATABASE_URL_DIRETA: postgresql+psycopg://f8:f8@db:5432/f8_store

volumes:
  postgres_local:
